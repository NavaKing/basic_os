{# Story Column: the week's cover story and the archive, laid out as a magazine (static/js/stories.js, static/css/magazine.css) #}
<section class="tab-panel" id="tab-story" role="tabpanel">
    <div class="hero">
        <img class="hero-image" id="hero_image" alt="This week's game-day banner" hidden>
        <div class="hero-overlay">
            <div class="hero-kicker" id="hero_kicker"></div>
            <div class="hero-title" id="hero_title"></div>
            <div class="hero-note" id="hero_note"></div>
        </div>
    </div>
    <div class="story-layout">
        <article class="mag-issue" id="lead_story"></article>
        <aside class="mag-issue story-archive">
            <h3 class="mag-feature-title">Back Issues</h3>
            <ul class="mag-index" id="history_feed_list"></ul>
        </aside>
    </div>
</section>
