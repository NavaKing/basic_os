{# Story Column: contents are rendered by static/js/stories.js #}
<section class="tab-panel" id="tab-story" role="tabpanel">
    <div class="hero">
        <img class="hero-image" id="hero_image" alt="This week's game-day banner" hidden>
        <div class="hero-overlay">
            <div class="hero-kicker" id="hero_kicker"></div>
            <div class="hero-title" id="hero_title"></div>
            <div class="hero-note" id="hero_note"></div>
        </div>
    </div>
    <div class="story-layout">
        <div class="panel">
            <h3>📰 The Dispatch</h3>
            <div class="lead-story" id="lead_story"></div>
        </div>
        <div class="panel">
            <h3>📜 Previous Stories</h3>
            <div class="table-wrapper" id="history_feed_list"></div>
        </div>
    </div>
</section>
